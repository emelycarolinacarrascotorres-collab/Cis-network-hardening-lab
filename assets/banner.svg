<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="CIS Network Hardening" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.55" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38BDF8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <circle cx="210" cy="160" r="190" fill="url(#glow)"/>
  <circle cx="1060" cy="150" r="230" fill="url(#glow)" opacity="0.6"/>

  <!-- escudo -->
  <g transform="translate(120,70)">
    <path d="M90 0 L170 30 V100 C170 155 135 190 90 210 C45 190 10 155 10 100 V30 Z"
          fill="#0B1220" stroke="url(#accent)" stroke-width="6"/>
    <path d="M90 22 L150 44 V100 C150 140 124 168 90 184 C56 168 30 140 30 100 V44 Z"
          fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="62" y="92" width="56" height="44" rx="7" fill="url(#accent)"/>
    <path d="M72 92 V80 a18 18 0 0 1 36 0 V92" fill="none" stroke="#38BDF8" stroke-width="7" stroke-linecap="round"/>
    <circle cx="90" cy="112" r="6" fill="#0B1220"/>
    <rect x="87" y="114" width="6" height="12" rx="3" fill="#0B1220"/>
  </g>

  <!-- título -->
  <text x="340" y="150" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="800" fill="#FFFFFF" letter-spacing="1">CIS Network</text>
  <text x="340" y="222" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="800" fill="url(#accent)" letter-spacing="1">Hardening</text>
  <text x="340" y="262" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#94A3B8" letter-spacing="2">ROUTER  ·  SWITCH  ·  FIREWALL   |   CISCO IOS  ·  FORTIOS  ·  PYTHON</text>

  <!-- red decorativa -->
  <g stroke="#38BDF8" stroke-opacity="0.55" stroke-width="2" fill="none">
    <path d="M1000 90 L1100 150 L1000 210"/>
    <path d="M1100 150 L1200 100"/>
    <path d="M1100 150 L1200 200"/>
    <path d="M1000 90 L930 60"/>
  </g>
  <g>
    <circle cx="1100" cy="150" r="16" fill="#2563EB" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="1000" cy="90" r="11" fill="#06B6D4"/>
    <circle cx="1000" cy="210" r="11" fill="#06B6D4"/>
    <circle cx="1200" cy="100" r="9" fill="#38BDF8"/>
    <circle cx="1200" cy="200" r="9" fill="#38BDF8"/>
    <circle cx="930" cy="60" r="7" fill="#38BDF8"/>
  </g>
  <rect x="0" y="312" width="1280" height="8" fill="url(#accent)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
