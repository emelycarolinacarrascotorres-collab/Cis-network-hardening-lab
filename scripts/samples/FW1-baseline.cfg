#config-version=FGVM64-7.0.12-FW-build0523-230902:opmode=0:vdom=0
#EJEMPLO escrito a mano para probar el script en modo --offline (no es la configuración real del laboratorio)
config system global
    set admin-lockout-duration 60
    set admin-lockout-threshold 5
    set admintimeout 480
    set hostname "FortiGate-VM64"
    set pre-login-banner disable
    set strong-crypto disable
    set timezone 04
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 10.25.0.2 255.255.255.252
        set allowaccess ping https ssh http telnet
        set alias "LAN-R1"
    next
    edit "port2"
        set vdom "root"
        set mode dhcp
        set allowaccess ping
        set alias "WAN"
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
    next
end
config system password-policy
    set status disable
    set minimum-length 8
end
config system snmp sysinfo
    set status enable
end
config system ntp
    set ntpsync enable
    set type fortiguard
end
config system auto-install
    set auto-install-config enable
    set auto-install-image enable
end
config log syslogd setting
    set status disable
end
config firewall policy
    edit 1
        set name "LAN-a-WAN"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic utm
        set nat enable
    next
    edit 2
        set name "Servidores-a-WAN"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "SERVIDORES"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS" "DNS"
        set logtraffic disable
    next
end
